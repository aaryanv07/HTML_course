    <!-- Position

* static – default position. (top, right, bottom, left, and z-index properties have no effect)
* relative – element is relative to itself. (top, right, bottom, left, and z-index will work)
* absolute – positioned relative to its closest positioned ancestor. (removed from flow)
* fixed – positioned relative to browser. (removed from flow)
* sticky – positioned based on user’s scroll position -->

    <!-- z-index
It decides the stack level of elements.


Overlapping elements with a larger z-index cover those with a smaller one.

z-index: auto;   /* default */
z-index: 1;
z-index: 2;
z-index: -1;
z-index: -2;

Note: Cannot be applied on static elements.

Higher z-index → element appears more in front.
Lower z-index → element appears more behind.

bydefault the first written element comes in the below -->

Background Size

background-size: auto;

* cover → fills the whole container, but some parts of the image may get cropped.
* contain → shows the full image inside the container, but may leave empty space.

    <!-- Flexbox

Flexible Box Layout

It is a one-dimensional layout method for arranging items in rows or columns. 

The Flex Model

* Flex container → The parent element that contains the flex items.
* Flex item → The child elements inside the flex container.
* Main axis → The primary direction in which flex items are arranged.
* Cross axis → The direction perpendicular to the main axis.

By default:

flex-direction: row;

So the main axis is horizontal and the cross axis is vertical.
-->

    <h1>Flexbox playground</h1>
    <div id="container">
        <div id="b1">box1

        </div>
        <div id="box2">box2

        </div>
        <div id="b3">box3

        </div>
        <div id="b4">box4

        </div>
        <div id="b5" style="height: 10rem;">box5

        </div>
    </div>

    <!-- Flexbox Direction

It sets how flex items are placed inside the flex container, including the axis and direction.

flex-direction: row;            /* default */
flex-direction: row-reverse;
flex-direction: column;
flex-direction: column-reverse;

* row → left to right
* row-reverse → right to left
* column → top to bottom
* column-reverse → bottom to top

Elements will try to take the maximum capacity of the parent container 
but they will not exceed it even if they have higher dimensions.

Flex Properties for Flex Container

* justify-content: alignment along the main axis
    * flex-start
    * flex-end
    * center
    * space-evenly
    * space-between
    * space-around
* flex-wrap
    * nowrap : It will not go on a new line.
    * wrap : It will go on a new line.
    * wrap-reverse : It will go on a new line in the reverse order.
* align-items: alignment along the cross axis
* align-content: controls the spacing between multiple flex lines along the cross axis.-->

<!-- Flex property
 
Align Self - Flex item aligns for itself.
Flex Grow - Flex item grows more than its siblings.
Flex Shrink - Flex item shrinks more than its siblings.

All these properties are only applied on flex items.
