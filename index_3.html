    <!-- Display Flex -->
    <!-- **Display Property**

`display: inline / block / inline-block / none`

- **inline** – Takes only the space required by the element. (no margin/ padding)
- **block** – Takes full space available in width.
- **inline-block** – Similar to inline but we can set margin & padding.
- **none** – To remove element from document flow.

**Correction:** Inline elements support horizontal
 margins and padding. `inline-block` also allows setting width, height, and vertical margins. -->


    <!-- Change the due display to inline. -->
    <div style="background-color: #f08804; height: 100px; margin-top: 2vh; display: inline-block;">This is a div</div>

    <!-- Change the due display to block. -->
    <button style="display: block;">Click Me!</button>
    <div style="background-color: blue; width: 100px; height: 100px; margin: 25px;padding: 25px;display: inline-block;">
    </div>
    <div
        style="background-color: green; width: 100px; height: 100px; margin: 25px;padding: 25px;display: inline-block;">
    </div>
    <div style="background-color: red; width: 100px; height: 100px; margin: 25px;padding: 25px;display: inline-block;">
    </div>
    <div style="background-color: red; width: 100px; height: 100px; margin: 25px;padding: 25px;display: none;"></div>

 It is often used to define a size as related to an element's 
 parent object. -->

<!-- EM
   font size of the parent in case of typographical properties 
 like font size and font size for element itself. 
 In case other properties like width  em Over here will
